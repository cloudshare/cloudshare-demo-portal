name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when @claude is mentioned (or an issue is assigned to claude)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # Pinned to 22.04: ubuntu-latest (24.04) triggers a Bun fd crash in the
    # action ("directory mismatch for tsconfig.json"). See anthropics/claude-code-action#1266.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # Pinned to a specific release instead of the moving @v1 tag to make
        # runs reproducible while the upstream Bun crash is unresolved.
        uses: anthropics/claude-code-action@v1.0.140
        with:
          # OAuth token provisioned by `/install-github-app`; uses the Claude
          # subscription for billing. Swap to `anthropic_api_key` for API-credit billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
